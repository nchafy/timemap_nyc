[project]
name = "timemap"
version = "0.1.0"
description = "NYC transit isochrone map over Google Maps saved places"
requires-python = ">=3.12"
# The ingest pipeline is deliberately stdlib-only: csv, json, urllib.parse,
# pathlib. Geocoding (which needs an HTTP client) is a separate concern.
dependencies = []

[project.scripts]
timemap-places = "timemap.places.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "jsonschema>=4", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=timemap.places",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
filterwarnings = ["error"]
markers = [
    "real_snapshot: needs the owner's private Takeout export; skipped unless TIMEMAP_TAKEOUT_DIR is set",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "TID", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
"scripts/**" = ["ARG", "PTH", "T201"]
# TakeoutError is the suffixed base class; the subclasses read as the condition
# they describe ("raise SourceFileUnreadable(path, ...)"), which is clearer at
# the call site than SourceFileUnreadableError.
"src/timemap/places/errors.py" = ["N818"]
# os.replace is the atomic rename. Path.replace does the same thing, but naming
# the module makes the atomicity guarantee explicit at the call site.
"src/timemap/places/writer.py" = ["PTH105"]
